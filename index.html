<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NecroDL</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#050505;
    height:100vh;
    overflow:hidden;
}

.splash{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
}

.logo{
    width:220px;
    margin-bottom:20px;
}

.title{
    font-size:48px;
    font-weight:800;
}

.title span{
    color:#FFD400;
}

.desc{
    margin-top:15px;
    text-align:center;
    color:#d0d0d0;
}

.desc p:first-child{
    font-size:20px;
    margin-bottom:8px;
}

.loading-box{
    width:180px;
    height:8px;
    background:#222;
    border-radius:999px;
    overflow:hidden;
    margin-top:80px;
}

.loading{
    width:0%;
    height:100%;
    background:#FFD400;
    animation:load 3s linear forwards;
}

.loading-text{
    margin-top:15px;
    color:#aaa;
}

@keyframes load{
    from{width:0%;}
    to{width:100%;}
}
</style>
</head>
<body>

<div class="splash">

    <img src="maskot.png" class="logo">

    <div class="title">
        Necro<span>DL</span>
    </div>

    <div class="desc">
        <p>Download Your Favorite Videos</p>
        <p>Fast • Simple • Free</p>
    </div>

    <div class="loading-box">
        <div class="loading"></div>
    </div>

    <div class="loading-text">
        Loading...
    </div>

</div>

<script>
setTimeout(()=>{
    window.location.href="home.html";
},3000);
</script>

</body>
</html>
